name: macos-ci

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G Xcode

      - name: Build
        run: cmake --build build --config Release

      - name: Package app
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/Release/FileLockAnalyzerMac.app" "dist/FileLockAnalyzerMac.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileLockAnalyzerMac
          path: build/Release/FileLockAnalyzerMac.app

      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileLockAnalyzerMac.zip
